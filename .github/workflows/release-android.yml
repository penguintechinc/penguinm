name: Release Android

on:
  release:
    types: [prereleased, released]

permissions:
  contents: read

jobs:
  release:
    name: release (${{ github.event.release.tag_name }})
    runs-on: ubuntu-latest
    # UID 1001:GID 0 matches the GitHub-hosted runner's ownership of
    # $GITHUB_WORKSPACE (uid 1001); T8 makes the image's /opt/flutter,
    # Android SDK dir, and appuser (uid 1000) home group-0 writable, so
    # 1001:0 can build without --user root. First CI run against the
    # T8-updated image is the validation of this pairing (R21).
    container:
      image: ghcr.io/penguintechinc/penguinm/flutter-android:3.44.8@sha256:3ea2245494e1f90c8a2ee9149250077d67fd6223a475d3ee6f66b9f62035dcf9 # pinned digest (T29): bump tag and digest together on any toolchain-image rebuild
      options: --user 1001:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    env:
      PENGUIN_ANDROID_KEYSTORE_B64: ${{ secrets.PENGUIN_ANDROID_KEYSTORE_B64 }}
      PENGUIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PENGUIN_ANDROID_KEYSTORE_PASSWORD }}
      PENGUIN_ANDROID_KEY_ALIAS: ${{ secrets.PENGUIN_ANDROID_KEY_ALIAS }}
      PENGUIN_ANDROID_KEY_PASSWORD: ${{ secrets.PENGUIN_ANDROID_KEY_PASSWORD }}
      PENGUIN_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PENGUIN_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark workspace safe for git (container runs as non-checkout UID)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Parse and validate release tag (<app>/vX.Y.Z)
        id: tag
        # Each app releases, versions, and branches independently — the
        # release tag names exactly one app and this job builds only that
        # app (no matrix). RELEASE_TAG is passed via env, never
        # interpolated directly into the script, since a release tag name
        # is attacker-influenced input.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          # Known apps — add new apps here as they're scaffolded.
          # docs/RELEASE.md).
          known_apps="penguin_reference penguincloud gazer"

          if [[ ! "$tag" =~ ^([^/]+)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-android: FAIL - tag '$tag' does not match '<app>/vX.Y.Z'" >&2
            exit 1
          fi
          app="${BASH_REMATCH[1]}"

          known=0
          for a in $known_apps; do
            if [ "$a" = "$app" ]; then
              known=1
              break
            fi
          done
          if [ "$known" -ne 1 ]; then
            echo "release-android: FAIL - tag '$tag' names unknown app '$app' (known: $known_apps)" >&2
            exit 1
          fi

          echo "release-android: tag '$tag' -> app '$app'"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=""
          test -n "${PENGUIN_ANDROID_KEYSTORE_B64:-}" || missing="$missing PENGUIN_ANDROID_KEYSTORE_B64"
          test -n "${PENGUIN_ANDROID_KEYSTORE_PASSWORD:-}" || missing="$missing PENGUIN_ANDROID_KEYSTORE_PASSWORD"
          test -n "${PENGUIN_ANDROID_KEY_ALIAS:-}" || missing="$missing PENGUIN_ANDROID_KEY_ALIAS"
          test -n "${PENGUIN_ANDROID_KEY_PASSWORD:-}" || missing="$missing PENGUIN_ANDROID_KEY_PASSWORD"
          test -n "${PENGUIN_PLAY_SERVICE_ACCOUNT_JSON:-}" || missing="$missing PENGUIN_PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "release-android: FAIL - required secret(s) empty:$missing" >&2
            exit 1
          fi
          echo "release-android: all required secrets present"

      - name: Decode signing keystore
        env:
          APP: ${{ steps.tag.outputs.app }}
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/penguin-release-${APP}.keystore"
          echo "$PENGUIN_ANDROID_KEYSTORE_B64" | base64 -d > "$keystore_path"
          echo "PENGUIN_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed App Bundle (prod flavor)
        working-directory: apps/${{ steps.tag.outputs.app }}
        run: flutter build appbundle --release --flavor prod --dart-define-from-file=env/prod.json --obfuscate --split-debug-info=build/symbols

      - name: Locate build output
        id: artifact
        working-directory: apps/${{ steps.tag.outputs.app }}
        env:
          APP: ${{ steps.tag.outputs.app }}
        run: |
          set -euo pipefail
          aab_path="build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          if [ ! -f "$aab_path" ]; then
            echo "release-android: FAIL - expected AAB not found at $aab_path" >&2
            exit 1
          fi
          echo "path=apps/${APP}/$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.tag.outputs.app }}-release-aab
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 90

      - name: Attach App Bundle to GitHub release
        # zizmor: ignore[superfluous-actions] -- Appendix A pins this action for
        # release-asset upload; `gh release upload` would be an unpinned-tool
        # equivalent with no SHA to pin against.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.artifact.outputs.path }}

      - name: Upload to Play Store (internal track)
        if: github.event.action == 'prereleased'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PENGUIN_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.penguintech.${{ steps.tag.outputs.app }}
          releaseFiles: ${{ steps.artifact.outputs.path }}
          track: internal
          status: completed

      - name: Upload to Play Store (production track)
        if: github.event.action == 'released'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PENGUIN_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.penguintech.${{ steps.tag.outputs.app }}
          releaseFiles: ${{ steps.artifact.outputs.path }}
          track: production
          status: completed
