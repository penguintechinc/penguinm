default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ── Hygiene ────────────────────────────────────────────────────────────────
  # stages: [pre-commit] is explicit on every hook below, not left to
  # default_stages -- observed in practice (a real `git push`, then
  # `pre-commit run --hook-stage pre-push --all-files`) that several of these
  # hooks' own upstream manifests carry a stage default that overrides the
  # top-level default_stages, so trailing-whitespace/end-of-file-fixer/
  # check-added-large-files/check-executables-have-shebangs re-ran (and
  # auto-fixed files) during `git push`. Explicit per-hook stages is the only
  # reliable fix.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=2048]
        stages: [pre-commit]
      - id: check-yaml
        args: [--allow-multiple-documents]
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  # ── Secrets (mandatory, every repo) ────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # ── Shell (Bash must stay 3.2-compatible — see general.md) ─────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        stages: [pre-commit]

  # ── Dockerfiles (Gazer toolchain image) ─────────────────────────────────────
  # --failure-threshold error: the imported gazer/Dockerfile carries pre-existing
  # warning-level findings (unpinned apt packages, missing SHELL -o pipefail) that
  # waddlebot itself ratchets via scripts/lint.sh + a baseline rather than blocking
  # commits on (see that repo's .pre-commit-config.yaml header comment). Blocking
  # error-level findings here while treating warnings as new debt to track, not an
  # import-time hard-fail.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold=error]
        stages: [pre-commit]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
        stages: [pre-commit]

  # ── Dockerfile rootless check ────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: dockerfile-rootless
        name: Dockerfile runs as non-root
        entry: scripts/hooks/check-dockerfile-rootless.sh
        language: script
        files: (^|/)Dockerfile[^/]*$
        stages: [pre-push]

  # ── Gazer (Flutter) — runs inside the gazer-toolchain container, never on the host ──
  - repo: local
    hooks:
      - id: gazer-lint
        name: Gazer Flutter lint (flutter analyze + dart format + ktlint)
        entry: bash -c 'make mobile-lint'
        language: system
        files: ^gazer/.*\.(dart|kt|kts)$
        pass_filenames: false
        stages: [pre-push]
