name: gazer
description: "Gazer -- live-streaming client for phones and tablets: phone camera or USB UVC capture card to any RTMP/RTMPS endpoint."
publish_to: 'none'
# X.Y.Z stays pre-1.0 through M1-M3; M4 cuts the first gazer-v1.0.0 tag
# (see spec Milestones M4). B is the epoch build number per the house
# versioning skill -- resolved by this step, not hand-edited later.
version: 0.1.0+1789002916

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 3.4.3
  go_router: 17.5.0
  # Aligned to the in-repo flutter_libs's own pin (round 1 coordinator
  # ruling) now that flutter_libs is a workspace path dependency -- the
  # external penguin-libs git ref's 9.2.4 hard-pin no longer applies.
  flutter_secure_storage: 11.1.1
  shared_preferences: 2.5.5
  connectivity_plus: 7.3.1
  intl: 0.20.2
  # Aligned to the workspace's resolved version (shells/penguin_app_shell,
  # apps/penguin_reference) now that flutter_libs is a workspace path
  # dependency -- the external penguin-libs' transitive file_picker/win32
  # chain that previously forced this down to 9.0.1 is gone (flutter_libs's
  # file_picker is now 12.3.0, which drops win32 entirely).
  package_info_plus: 10.2.1
  # Replaces dio (client-tier standard: package:http, never dio).
  http: 1.6.0
  url_launcher: 6.3.2
  # Unrelated to the flutter_libs/win32 chain that gated other deps above;
  # this pin's own contingency (permission_handler_android 14.1.0's
  # android-37-only API symbols/non-existent platform) is unaffected by the
  # flutter_libs move, so it is unchanged -- see the pin on
  # permission_handler_android below for the exact mechanism.
  permission_handler: 12.0.3
  # Direct pin (not a spec dependency) forcing permission_handler 12.0.3's
  # transitive permission_handler_android down to 13.0.1 specifically --
  # verified by source inspection to contain neither
  # ACCESS_LOCAL_NETWORK nor CINNAMON_BUN (both added in
  # permission_handler_android 13.0.2) and to declare compileSdkVersion 35
  # (installed in mobile/gazer/Dockerfile), avoiding the non-existent
  # android-37 platform that 14.x requires.
  permission_handler_android: 13.0.1
  # Aligned to the workspace's resolved version now that flutter_libs is a
  # workspace path dependency -- the external penguin-libs' transitive
  # win32 chain that previously forced this down to 12.4.0 is gone.
  device_info_plus: 13.2.0
  crypto: 3.0.7
  flutter_libs:
    path: ../../packages/flutter_libs

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  pigeon: 28.0.0
  mocktail: 1.0.5
  flutter_lints: 6.0.0
  # Already resolved transitively (via shared_preferences 2.5.5) at this exact
  # version per pubspec.lock -- declared directly, not newly introduced,
  # because license_client_test.dart imports InMemorySharedPreferencesAsync
  # from it directly and `depend_on_referenced_packages` (analysis_options.yaml
  # strict-inference) requires every directly-imported package to be a direct
  # dependency. Pinned exact version, no ^/~, per Dependency Pinning.
  shared_preferences_platform_interface: 2.4.2
  # Already resolved transitively (via url_launcher 6.3.2) at these exact
  # versions per pubspec.lock -- declared directly, not newly introduced,
  # for the same `depend_on_referenced_packages` reason as
  # shared_preferences_platform_interface above: status_panel_test.dart
  # mocks UrlLauncherPlatform.instance directly (url_launcher_platform_interface)
  # via MockPlatformInterfaceMixin (plugin_platform_interface) to test the
  # canLaunchUrl/launchUrl failure paths without a real platform channel.
  url_launcher_platform_interface: 2.3.2
  # Already resolved transitively (via permission_handler 12.0.3) at this
  # exact version per pubspec.lock -- declared directly, not newly
  # introduced, because permission_gate_test.dart imports
  # PermissionHandlerPlatform from it directly (to mock the platform
  # channel) and `depend_on_referenced_packages` requires every
  # directly-imported package to be a direct dependency. Pinned exact
  # version, no ^/~, per Dependency Pinning -- same pattern as
  # shared_preferences_platform_interface above (Task 7).
  permission_handler_platform_interface: 4.4.1
  # Already resolved transitively (via permission_handler_platform_interface)
  # at this exact version per pubspec.lock -- declared directly because
  # permission_gate_test.dart imports MockPlatformInterfaceMixin from it
  # directly. Pinned exact version, no ^/~, per Dependency Pinning.
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true
  generate: true
