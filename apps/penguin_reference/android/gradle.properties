# Heap sized for the shared flutter-android toolchain container (tooling/docker/), not
# an unconstrained dev workstation — the flutter-create template default (8 gigabytes)
# risks OOM-killing concurrent CI jobs on the same runner.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
