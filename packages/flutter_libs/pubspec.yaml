name: flutter_libs
description: Shared Flutter widgets for Penguin Tech applications — Elder dark theme, forms, login, sidebar, versioning.
version: 0.1.0
repository: https://github.com/penguintechinc/penguin-libs
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  crypto: 3.0.7
  # Re-pinned from 8.3.7 (coordinator ruling, round 1): 12.3.0 drops the
  # win32 dependency entirely (gone from 12.0.0 on), resolving the conflict
  # with flutter_secure_storage 11.1.1's win32 ^6.0.1. 13.0.0 (published
  # 2026-09-14) is skipped deliberately. 8.x->12.x API breakage in
  # form_field_builder.dart is Task T2's job.
  file_picker: 12.3.0
  flutter_secure_storage: 11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5
  penguin_lints:
    path: ../penguin_lints
