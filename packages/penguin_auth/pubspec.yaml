name: penguin_auth
description: AuthController, Session and OIDC/password AuthBackends backing penguin_core's TokenProvider.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_appauth: 12.1.0
  flutter_libs:
    path: ../flutter_libs
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.1.1
  go_router: 17.5.0
  http: 1.6.0
  penguin_core:
    path: ../penguin_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  penguin_lints:
    path: ../penguin_lints
