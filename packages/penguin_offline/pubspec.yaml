name: penguin_offline
description: ConnectivityMonitor, sqlite3-backed OfflineStore and SyncQueue with the connectivity banner and stale-data chip.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  connectivity_plus: 7.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  intl: 0.20.3
  path: 1.9.1
  path_provider: 2.1.6
  penguin_api:
    path: ../penguin_api
  penguin_core:
    path: ../penguin_core
  # 3.6.0 requires hooks ^2.2.0 -> meta ^1.19.0, incompatible with Flutter 3.44.8 (meta 1.18.0)
  sqlite3: 3.5.2
  uuid: 4.6.0

dev_dependencies:
  http: 1.6.0
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  penguin_lints:
    path: ../penguin_lints
  penguin_testing:
    path: ../penguin_testing
