name: penguin_rasp
description: RaspGuard runtime, the build-time enforcement toggle, and OTel metric names for RASP (Runtime Application Self-Protection) threat detection.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: 13.2.0
  freerasp: 8.2.2
  penguin_core:
    path: ../penguin_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  penguin_lints:
    path: ../penguin_lints
  penguin_testing:
    path: ../penguin_testing
