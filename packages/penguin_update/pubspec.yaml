name: penguin_update
description: UpdateChecker (pub_semver) and the UpdatePrompt banner/dialog for in-app update checks.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  http: 1.6.0
  penguin_api:
    path: ../penguin_api
  penguin_core:
    path: ../penguin_core
  pub_semver: 2.2.1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
  penguin_lints:
    path: ../penguin_lints
  penguin_testing:
    path: ../penguin_testing
